name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Websites to deploy after validation
        type: choice
        default: auto
        options: [auto, test, called-together, both]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dependency-graph: ${{ steps.dependency-graph.outputs.graph }}
      called-together-artifact-id: ${{ steps.upload-called-together.outputs.artifact-id }}
      called-together-sha256: ${{ steps.archive-called-together.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js and npm download cache
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up project npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.1
      - name: Print Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check TypeScript types
        run: npm run check-types
      - name: Run unit tests
        run: npm test
      - name: Test deployment selection
        run: node --test scripts/deployment-decisions.test.mjs
      - name: Export workspace dependency graph
        id: dependency-graph
        run: node scripts/select-deployments.mjs --graph
      - name: Build website static export
        run: npm run build:azure
      - name: Verify static export
        run: |
          test -f apps/web/out/index.html
          if [ -f apps/web/public/staticwebapp.config.json ]; then
            cmp apps/web/public/staticwebapp.config.json apps/web/out/staticwebapp.config.json
          fi
      - name: Build Storybook
        run: npm run build-storybook
      - name: Build and package Called Together standalone server
        run: npm run package:called-together
      - name: Smoke-test isolated Called Together artifact
        run: npm run verify:called-together
      - name: Archive smoke-tested Called Together package
        id: archive-called-together
        run: |
          tar -czf "$RUNNER_TEMP/called-together.tar.gz" -C artifacts/called-together .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/called-together.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload Called Together archive
        id: upload-called-together
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/called-together.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: apps/web/out/
          include-hidden-files: true
          if-no-files-found: error

  deployment-decisions:
    name: Select deployments
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy-test: ${{ steps.selection.outputs.deploy-test }}
      deploy-called-together: ${{ steps.selection.outputs.deploy-called-together }}
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Compare each app to its last successful deployment
        id: selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'auto' }}
          DEPLOYMENT_GRAPH: ${{ needs.validate.outputs.dependency-graph }}
        run: node scripts/select-deployments.mjs

  deploy:
    name: Deploy
    needs: [validate, deployment-decisions]
    if: needs.validate.result == 'success' && needs.deployment-decisions.outputs.deploy-test == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v8
        with:
          name: web-static
          path: apps/web/out
      - name: Verify downloaded static export
        run: test -f apps/web/out/index.html
      - name: Deploy static export
        uses: Azure/static-web-apps-deploy@v1
        env:
          IS_STATIC_EXPORT: "true"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_BUSH_002C17210 }}
          action: upload
          app_location: apps/web/out
          api_location: ""
          output_location: ""
          skip_app_build: true

  deploy-called-together:
    name: Deploy Called Together
    needs: [validate, deployment-decisions]
    if: needs.validate.result == 'success' && needs.deployment-decisions.outputs.deploy-called-together == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No environment: retain repo:ec76/starweave:ref:refs/heads/main OIDC trust.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated Called Together archive
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validate.outputs.called-together-artifact-id }}
          path: ${{ runner.temp }}/called-together-download
          merge-multiple: true
      - name: Verify and extract Called Together archive
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.called-together-sha256 }}
        run: |
          cd "$RUNNER_TEMP/called-together-download"
          printf '%s  called-together.tar.gz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/called-together-deploy"
          tar -xzf called-together.tar.gz --same-permissions --no-same-owner -C "$RUNNER_TEMP/called-together-deploy"
          test -f "$RUNNER_TEMP/called-together-deploy/apps/called-together/server.js"
          test -d "$RUNNER_TEMP/called-together-deploy/apps/called-together/.next/static"
          test -d "$RUNNER_TEMP/called-together-deploy/node_modules/next"
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.CALLED_TOGETHER_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CALLED_TOGETHER_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CALLED_TOGETHER_AZURE_SUBSCRIPTION_ID }}
      - name: Disable App Service remote builds for the prebuilt package
        run: |
          az webapp config appsettings set \
            --name called-together-dev-ec76 \
            --resource-group rg-called-together-dev \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false \
            --output none
      - name: Deploy Called Together standalone server
        uses: azure/webapps-deploy@v3
        with:
          app-name: called-together-dev-ec76
          resource-group-name: rg-called-together-dev
          package: ${{ runner.temp }}/called-together-deploy
          startup-command: HOSTNAME=0.0.0.0 node apps/called-together/server.js
      - name: Verify live Called Together health and homepage
        timeout-minutes: 8
        env:
          SITE_URL: https://called-together-dev-ec76-gyfufcfwg9etchgs.centralus-01.azurewebsites.net
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                "$SITE_URL/api/health" -o "$RUNNER_TEMP/called-together-health.json" \
              && jq --exit-status '.status == "ok"' "$RUNNER_TEMP/called-together-health.json" > /dev/null \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                "$SITE_URL/" -o "$RUNNER_TEMP/called-together-home.html" \
              && grep --fixed-strings --quiet 'Called Together' "$RUNNER_TEMP/called-together-home.html"; then
              echo "Called Together health and homepage checks passed."
              exit 0
            fi
            echo "Called Together is not ready (attempt $attempt/18)."
            if [ "$attempt" -lt 18 ]; then sleep 5; fi
          done
          echo "::error::Called Together health or homepage verification failed. Check App Service startup and deployment logs."
          exit 1
