name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js and npm download cache
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up project npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.1
      - name: Print Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check TypeScript types
        run: npm run check-types
      - name: Run unit tests
        run: npm test
      - name: Build website static export
        run: npm run build:azure
      - name: Verify static export
        run: |
          test -f apps/web/out/index.html
          if [ -f apps/web/public/staticwebapp.config.json ]; then
            cmp apps/web/public/staticwebapp.config.json apps/web/out/staticwebapp.config.json
          fi
      - name: Build Storybook
        run: npm run build-storybook
      - name: Build and package Called Together standalone server
        run: npm run package:called-together
      - name: Smoke-test isolated Called Together artifact
        run: npm run verify:called-together
      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: apps/web/out/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v8
        with:
          name: web-static
          path: apps/web/out
      - name: Verify downloaded static export
        run: test -f apps/web/out/index.html
      - name: Deploy static export
        uses: Azure/static-web-apps-deploy@v1
        env:
          IS_STATIC_EXPORT: "true"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_BUSH_002C17210 }}
          action: upload
          app_location: apps/web/out
          api_location: ""
          output_location: ""
          skip_app_build: true
